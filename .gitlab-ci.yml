image: debian:sid

pages:
  stage: deploy
  script:
    - apt-get update
    - apt-get -y install inkscape texlive-full
    - inkscape --export-dpi=300 --export-filename=ffc.png ffc.svg
    - lualatex Freifunk-Beitragsordnung.tex
    - pdflatex Freifunk-Beitragsordnung.tex
    - xelatex Freifunk-Beitragsordnung.tex
    - lualatex Freifunk-Satzung.tex
    - pdflatex Freifunk-Satzung.tex
    - xelatex Freifunk-Satzung.tex
    - lualatex Mitgliedsantrag.tex
    - pdflatex Mitgliedsantrag.tex
    - xelatex Mitgliedsantrag.tex
    - mkdir .public
    - cp LICENSE *.pdf .public
    - mv .public public
  artifacts:
    paths:
      - public

